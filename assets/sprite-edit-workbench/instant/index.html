<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite 即时编辑工作台</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#101522;color:#e6edf8;font:15px system-ui}header{padding:24px;border-bottom:1px solid #344159}h1{margin:0 0 10px;font-size:25px}h2{margin-top:0}button,select,input{font:inherit;color:inherit;background:#26334b;border:1px solid #526684;border-radius:6px}button,select{padding:9px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){border-color:#8fcaff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffcd70;outline-offset:3px}nav{display:flex;gap:8px;margin-top:20px}button.active{background:#365f98}main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:24px;max-width:1600px;margin:auto}aside button{display:block;width:100%;text-align:left;margin:8px 0}canvas{display:block;width:min(100%,440px);height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#293449 0 25%,#344158 0 50%) 0/24px 24px;border:1px solid #526684;border-radius:8px}.meta{color:#a9bbd5;line-height:1.8}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:15px 0}input[type=number]{width:74px;padding:7px}input[type=checkbox]{width:auto;accent-color:#71d6b0}.panel{min-width:0;background:#192237;padding:20px;border-radius:10px}a{color:#8fcaff}#candidates button.active{background:#365f98;border:2px solid #8fcaff;color:#fff;font-weight:700}#candidates{align-items:stretch}.stage{display:flex;gap:24px;align-items:center}.stage-notes{max-width:280px}.stage-notes strong{display:block;font-size:23px;line-height:1.5;color:#83dfbe}#timeline{display:flex;gap:4px;overflow-x:auto;padding:6px 0 12px}#timeline button{white-space:nowrap;min-width:64px;font-size:12px;background:#24483f;border-color:#3a7864}#timeline button.current{background:#886625;border-color:#ffcd70}#filmstrip{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px,1fr));gap:10px;max-height:420px;overflow:auto;padding:4px}.frame-card{position:relative;border:2px solid #496079;border-radius:8px;overflow:hidden;background:#243044;padding-top:30px}.frame-card.current{border-color:#ffcd70}.frame-card .keep,.frame-card .remove{position:absolute;top:3px;z-index:1;width:28px;height:26px;padding:0;font-size:20px;line-height:24px}.keep{left:4px}.remove{right:4px}.keep[aria-pressed=true]{background:#23624e;color:#adf9ce;border-color:#62b694}.remove[aria-pressed=true]{background:#793b45;color:#ffd5da;border-color:#ec899a}.frame-view{border:0;padding:0;width:100%;display:flex;flex-direction:column;align-items:center;background:transparent}.frame-view img,.tile{display:block;width:112px;height:112px;image-rendering:pixelated;object-fit:contain}.frame-label{font-size:12px;padding:7px 0}.frame-card.excluded .frame-view{opacity:.32}.frame-card.excluded .frame-label{text-decoration:line-through}.frame-card.outside .frame-view{opacity:.5}#message{color:#9cdac8;font-size:13px}#resources{display:flex;gap:18px}#audio-controls{padding:12px;background:#111c2b;border-radius:8px}#selection-summary{font-size:20px}#frame{font-variant-numeric:tabular-nums}#restart{background:#285445}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.stage{flex-direction:column;align-items:flex-start}aside{display:flex;gap:5px;overflow:auto}aside button{width:auto;min-width:110px}.stage-notes{max-width:none}.panel{padding:14px}.stage-notes strong{font-size:18px}}
</style>
<header><h1>Sprite 即时编辑工作台</h1><div class="meta" id="budget">即时逐帧编辑 · 图片播放 + 独立音效</div><nav><button data-tab="work" class="active">工作中</button><button data-tab="confirmed">已确认</button><button data-tab="game">游戏绑定</button></nav></header>
<audio id="sound" preload="metadata" hidden></audio>
<main><aside id="actions" aria-label="动作列表"></aside><section class="panel"><h2 id="title"></h2><p id="status" class="meta"></p><div id="candidates" class="controls" aria-label="版本列表"></div>
<div class="stage"><canvas width="576" height="576" id="preview" aria-label="精灵即时预览"></canvas><div class="stage-notes"><strong id="selection-summary"></strong><p class="meta">在下方逐帧取舍，直接看动画变化。<br>✓ 保留这一帧<br>× 跳过这一帧</p><p class="meta">图片顺序就是播放顺序。<br>时间轴会随保留帧立即更新。</p></div></div>
<div class="controls"><button id="play" disabled>播放</button><button id="restart">从头播放</button><button id="prev" aria-label="上一保留帧">←</button><button id="next" aria-label="下一保留帧">→</button><span id="frame"></span></div>
<div id="editing" class="controls"><label>首帧 <input id="start" type="number" min="1" max="1" value="1"></label><label>末帧 <input id="end" type="number" min="1" max="1" value="1"></label><label>FPS <input id="fps" type="number" min="1" max="120" value="24"></label><label>播放速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>帧时长 <select id="timing"><option value="original">保留原停留时长</option><option value="uniform">每帧等长</option></select></label><label><input type="checkbox" id="loop"> 循环</label></div>
<div class="controls" id="audio-controls"><label><input type="checkbox" id="audio-enabled"> 播放音效</label><label>从保留后的第 <input id="audio-start" type="number" min="1" max="1" value="1"> 帧开始</label><span class="meta" id="audio-status"></span></div>
<p class="meta">播放时间轴 · 顺序 / 原帧号（鼠标停留查看起止时间）</p><div id="timeline" aria-label="播放时间轴"></div><p id="timeline-empty" hidden>尚未保留任何帧。点击下方 ✓ 或“全部保留”恢复播放。</p>
<div class="controls"><button id="keep-all">全部保留</button><button id="exclude-all">全部排除</button><button id="export">导出剪辑方案</button></div>
<p id="detail" class="meta"></p><div id="filmstrip" aria-label="全部动作帧"></div><p id="message" role="status"></p><div id="resources"></div><p class="meta">左右箭头逐帧查看。当前是预览剪辑，不代表动作已确认或已绑定游戏。</p>
</section></main><script type="module" src="app.js"></script></html>
