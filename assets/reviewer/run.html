<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>动作资产工作台</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.45 system-ui, sans-serif; background: #090d16; color: #edf2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: auto 205px minmax(0, 1fr); align-items: center; gap: 18px; min-height: 52px; padding: 8px 14px; border-bottom: 1px solid #28334b; background: #101728; }
    .header-actions { display: flex; gap: 8px; }
    button { font: inherit; }
    header button { border: 1px solid #3a4967; border-radius: 7px; padding: 7px 10px; color: #edf2ff; background: #202c44; cursor: pointer; }
    header button:disabled { opacity: .4; cursor: default; }
    header button.active { border-color: #d7a947; color: #fff4ce; background: #5a421c; }
    #counter { padding: 6px 10px; border: 1px solid #6382b4; border-radius: 7px; color: #f5f8ff; background: #23314c; box-shadow: 0 0 0 1px rgb(138 180 255 / 12%) inset; text-align: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .15px; white-space: nowrap; }
    #title { min-width: 0; overflow: hidden; color: #edf2ff; font-size: 16px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 34vw); min-height: calc(100vh - 52px); }
    main.confirmed-mode { grid-template-columns: 260px minmax(0, 1fr) minmax(330px, 34vw); }
    #confirmed-actions { position: sticky; top: 52px; height: calc(100vh - 52px); padding: 12px 10px 22px; border-right: 1px solid #28334b; background: #0d1422; overflow: auto; }
    #confirmed-actions[hidden] { display: none; }
    .action-group { margin: 10px 8px 7px; color: #8796b1; font-size: 11px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .action-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; width: 100%; margin: 0 0 6px; padding: 9px 10px; border: 1px solid #27344d; border-radius: 8px; color: #dce6fb; text-align: left; background: #151f32; cursor: pointer; }
    .action-link:hover { border-color: #61789f; background: #1b2941; }
    .action-link.selected { border-color: #8ab4ff; box-shadow: 0 0 0 1px #8ab4ff inset; background: #223451; }
    .action-name { min-width: 0; overflow: hidden; font-weight: 780; text-overflow: ellipsis; white-space: nowrap; }
    .action-id { grid-column: 1 / -1; min-width: 0; overflow: hidden; color: #8695af; font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .action-state { align-self: start; padding: 2px 5px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .state-runtime_bound { color: #baf4cf; background: #17442c; }
    .state-runtime_registered { color: #d5dded; background: #39445a; }
    .state-approved_unbound { color: #ffe6a6; background: #5b4318; }
    .new-marker { color: #8ac6ff; }
    #frames { align-content: start; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 14px; overflow: auto; }
    .frame { margin: 0; min-width: 0; border: 1px solid #28334b; border-radius: 9px; overflow: hidden; background: #121a2b; cursor: pointer; }
    .frame:hover { border-color: #61789f; }
    .frame:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
    .frame.selected { border-color: #8ab4ff; box-shadow: 0 0 0 2px #8ab4ff inset; background: #1a2942; }
    .frame img, video, #selected-frame { display: block; width: 100%; object-fit: contain; image-rendering: pixelated; background-color: #172135;
      background-image: linear-gradient(45deg,#26344d 25%,transparent 25%),linear-gradient(-45deg,#26344d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#26344d 75%),linear-gradient(-45deg,transparent 75%,#26344d 75%);
      background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
    .frame img { aspect-ratio: 18 / 11; }
    figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; color: #aeb9cd; font-size: 12px; font-variant-numeric: tabular-nums; }
    aside { position: sticky; top: 52px; display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 52px); min-height: 0; padding: 16px; border-left: 1px solid #28334b; background: #101728; overflow: hidden; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 19px; overflow-wrap: anywhere; }
    h2 { font-size: 15px; }
    .viewer-panel { display: flex; flex-direction: column; min-height: 0; }
    .video-panel { flex: 0 1 47%; }
    .still-panel { flex: 1 1 53%; }
    .viewer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    #selected-label { color: #aeb9cd; font-size: 12px; font-variant-numeric: tabular-nums; }
    video { flex: 1; min-height: 0; border-radius: 10px; }
    #selected-frame { flex: 1; min-height: 0; border: 1px solid #28334b; border-radius: 10px; }
    #message { color: #ffd27b; }
    #action-meta { display: grid; gap: 5px; padding: 9px 11px; border: 1px solid #33415d; border-radius: 8px; color: #cbd6ea; background: #162034; font-size: 12px; }
    #action-meta[hidden] { display: none; }
    #action-status { justify-self: start; }
    #action-note { color: #9faeca; overflow-wrap: anywhere; }
    @media (max-width: 820px) {
      header { grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; }
      #title { grid-column: 1 / -1; }
      main, main.confirmed-mode { grid-template-columns: 1fr; }
      #confirmed-actions { position: static; height: auto; max-height: 38vh; border-right: 0; border-bottom: 1px solid #28334b; }
      aside { position: static; height: auto; overflow: visible; border-left: 0; border-top: 1px solid #28334b; }
      #frames { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      video, #selected-frame { min-height: 42vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-actions">
      <button id="prev">← 上一个</button>
      <button id="next">下一个 →</button>
      <button id="confirmed-toggle" disabled>已确认的（0）</button>
    </div>
    <span id="counter" aria-label="当前 Sprite 和总 Sprite 数">加载中…</span>
    <h1 id="title">动作资产工作台</h1>
  </header>
  <main>
    <nav id="confirmed-actions" aria-label="已确认角色动作" hidden></nav>
    <section id="frames" aria-label="全部关键帧"></section>
    <aside>
      <section id="action-meta" hidden aria-label="角色动作绑定状态">
        <span id="action-status" class="action-state"></span>
        <span id="action-binding"></span>
        <span id="action-note"></span>
      </section>
      <section class="viewer-panel video-panel" aria-labelledby="video-heading">
        <div class="viewer-heading"><h2 id="video-heading">动作播放</h2><span id="timing"></span></div>
        <video id="preview" controls loop playsinline></video>
      </section>
      <section class="viewer-panel still-panel" aria-labelledby="still-heading">
        <div class="viewer-heading"><h2 id="still-heading">单帧查看</h2><span id="selected-label">请选择左侧帧</span></div>
        <img id="selected-frame" alt="当前选中的动作帧">
      </section>
      <div id="message" role="status"></div>
    </aside>
  </main>
  <script>
    const state = {
      mode: "process",
      processEntries: [],
      confirmedEntries: [],
      processIndex: 0,
      confirmedIndex: 0,
      renderToken: 0,
      frames: [],
      selectedFrameIndex: -1,
      selectedFigure: null
    };
    const byId = id => document.getElementById(id);
    const safePath = value => value ? encodeURI(value) : "";
    const currentEntries = () => state.mode === "confirmed" ? state.confirmedEntries : state.processEntries;
    const currentIndex = () => state.mode === "confirmed" ? state.confirmedIndex : state.processIndex;
    const setCurrentIndex = value => {
      if (state.mode === "confirmed") state.confirmedIndex = value;
      else state.processIndex = value;
    };

    function setVideo(path) {
      const video = byId("preview");
      video.pause();
      video.removeAttribute("src");
      if (path) video.src = safePath(path);
      video.load();
    }

    function framePath(manifestPath, relative) {
      const slash = manifestPath.lastIndexOf("/");
      return `${slash >= 0 ? manifestPath.slice(0, slash + 1) : ""}${relative}`;
    }

    function selectFrame(frame, manifestPath, figure) {
      if (state.selectedFigure) {
        state.selectedFigure.classList.remove("selected");
        state.selectedFigure.setAttribute("aria-selected", "false");
      }
      state.selectedFigure = figure;
      state.selectedFrameIndex = Number(figure.dataset.framePosition);
      figure.classList.add("selected");
      figure.setAttribute("aria-selected", "true");
      const index = Number(frame.index) + 1;
      const time = Number(frame.source_time_seconds || 0);
      byId("selected-frame").src = safePath(framePath(manifestPath, frame.file));
      byId("selected-frame").alt = `第 ${index} 帧，${time.toFixed(3)} 秒`;
      byId("selected-label").textContent = `#${String(index).padStart(2, "0")} · ${time.toFixed(3)}s`;
    }

    function moveSelectedFrame(delta) {
      if (!state.frames.length) return;
      const nextIndex = Math.max(
        0,
        Math.min(state.frames.length - 1, state.selectedFrameIndex + delta)
      );
      const next = state.frames[nextIndex];
      selectFrame(next.frame, next.manifestPath, next.figure);
      next.figure.focus({preventScroll: true});
      next.figure.scrollIntoView({block: "nearest", inline: "nearest"});
    }

    function renderFrames(manifest, manifestPath) {
      const container = byId("frames");
      container.replaceChildren();
      state.frames = [];
      state.selectedFrameIndex = -1;
      state.selectedFigure = null;
      for (const [position, frame] of (manifest.frames || []).entries()) {
        const figure = document.createElement("figure");
        figure.className = "frame";
        figure.dataset.framePosition = String(position);
        figure.tabIndex = 0;
        figure.setAttribute("role", "button");
        figure.setAttribute("aria-selected", "false");
        const image = document.createElement("img");
        image.loading = "lazy";
        image.alt = `第 ${Number(frame.index) + 1} 帧`;
        image.src = safePath(framePath(manifestPath, frame.file));
        const caption = document.createElement("figcaption");
        const number = document.createElement("span");
        number.textContent = `#${String(Number(frame.index) + 1).padStart(2, "0")}`;
        const time = document.createElement("span");
        time.textContent = `${Number(frame.source_time_seconds || 0).toFixed(3)}s`;
        caption.append(number, time);
        figure.append(image, caption);
        figure.onclick = () => selectFrame(frame, manifestPath, figure);
        figure.onkeydown = event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectFrame(frame, manifestPath, figure);
          }
        };
        container.appendChild(figure);
        state.frames.push({frame, manifestPath, figure});
        if (!state.selectedFigure) selectFrame(frame, manifestPath, figure);
      }
    }

    function renderConfirmedNavigation() {
      const navigation = byId("confirmed-actions");
      navigation.replaceChildren();
      let previousGroup = "";
      for (const [index, entry] of state.confirmedEntries.entries()) {
        const group = entry.group || "其他";
        if (group !== previousGroup) {
          const heading = document.createElement("div");
          heading.className = "action-group";
          heading.textContent = group;
          navigation.appendChild(heading);
          previousGroup = group;
        }
        const button = document.createElement("button");
        button.className = "action-link";
        button.classList.toggle("selected", state.mode === "confirmed" && index === state.confirmedIndex);
        button.type = "button";
        button.title = `${entry.display_name || entry.action_id} · ${entry.state_label || ""}`;
        const name = document.createElement("span");
        name.className = "action-name";
        name.textContent = entry.display_name || entry.action_id;
        if (entry.new_this_round) {
          const marker = document.createElement("span");
          marker.className = "new-marker";
          marker.textContent = " · 本轮";
          name.appendChild(marker);
        }
        const status = document.createElement("span");
        status.className = `action-state state-${entry.state || ""}`;
        status.textContent = entry.state === "runtime_bound"
          ? "已用"
          : entry.state === "runtime_registered" ? "已装入" : "未绑定";
        const identifier = document.createElement("span");
        identifier.className = "action-id";
        identifier.textContent = entry.action_id;
        button.append(name, status, identifier);
        button.onclick = () => {
          state.confirmedIndex = index;
          render().catch(error => { byId("message").textContent = error.message; });
        };
        navigation.appendChild(button);
      }
    }

    function renderActionMeta(entry) {
      const panel = byId("action-meta");
      if (state.mode !== "confirmed") {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      const status = byId("action-status");
      status.className = `action-state state-${entry.state || ""}`;
      status.textContent = entry.state_label || entry.state || "正式角色动作";
      const targets = entry.binding_targets || [];
      byId("action-binding").textContent = targets.length
        ? `使用位置：${targets.join("、")}`
        : "使用位置：尚未绑定玩法";
      const source = entry.source_review_sprite ? `来源审核 Sprite ${entry.source_review_sprite}。` : "";
      byId("action-note").textContent = `${source}${entry.note || ""}`;
    }

    async function render() {
      const entries = currentEntries();
      const index = currentIndex();
      const entry = entries[index];
      if (!entry) return;
      const token = ++state.renderToken;
      byId("counter").textContent = state.mode === "confirmed"
        ? `已确认：第 ${index + 1} 个 / 共 ${entries.length} 个`
        : `制作过程：第 ${index + 1} 个 / 共 ${entries.length} 个`;
      const spriteName = state.mode === "confirmed"
        ? `${entry.display_name || entry.action_id} · ${entry.action_id}`
        : `${entry.action_id} · ${entry.candidate_id}`;
      byId("title").textContent = spriteName;
      byId("title").title = spriteName;
      setVideo(entry.paths?.preview);
      byId("prev").disabled = index === 0;
      byId("next").disabled = index === entries.length - 1;
      byId("message").textContent = "";
      byId("selected-frame").removeAttribute("src");
      byId("selected-label").textContent = "请选择左侧帧";
      byId("frames").replaceChildren();
      byId("timing").textContent = "";
      renderActionMeta(entry);
      renderConfirmedNavigation();
      const manifestPath = entry.paths?.manifest;
      if (!manifestPath) {
        byId("message").textContent = "缺少帧清单，请重新处理这个候选。";
        return;
      }
      const manifest = await fetch(safePath(manifestPath), {cache: "no-store"}).then(response => {
        if (!response.ok) throw new Error(`帧清单加载失败：HTTP ${response.status}`);
        return response.json();
      });
      if (token !== state.renderToken) return;
      byId("timing").textContent = `${manifest.frame_count} 帧 · ${manifest.fps} fps · ${manifest.duration_seconds}s`;
      renderFrames(manifest, manifestPath);
    }

    function move(delta) {
      const entries = currentEntries();
      setCurrentIndex(Math.max(0, Math.min(entries.length - 1, currentIndex() + delta)));
      render().catch(error => { byId("message").textContent = error.message; });
    }

    function switchMode() {
      if (!state.confirmedEntries.length) return;
      state.mode = state.mode === "confirmed" ? "process" : "confirmed";
      const confirmed = state.mode === "confirmed";
      byId("confirmed-toggle").classList.toggle("active", confirmed);
      byId("confirmed-toggle").setAttribute("aria-pressed", String(confirmed));
      byId("confirmed-toggle").textContent = confirmed
        ? `制作过程（${state.processEntries.length}）`
        : `已确认的（${state.confirmedEntries.length}）`;
      byId("confirmed-actions").hidden = !confirmed;
      document.querySelector("main").classList.toggle("confirmed-mode", confirmed);
      render().catch(error => { byId("message").textContent = error.message; });
    }

    byId("prev").onclick = () => move(-1);
    byId("next").onclick = () => move(1);
    byId("confirmed-toggle").onclick = switchMode;
    document.addEventListener("keydown", event => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const tag = event.target?.tagName?.toLowerCase();
      if (["input", "textarea", "select", "button", "video"].includes(tag)) return;
      event.preventDefault();
      moveSelectedFrame(event.key === "ArrowLeft" ? -1 : 1);
    });
    const requiredQueue = fetch("review-queue.json", {cache: "no-store"}).then(response => {
      if (!response.ok) throw new Error(`制作过程队列加载失败：HTTP ${response.status}`);
      return response.json();
    });
    const optionalConfirmedQueue = fetch("confirmed-bound-queue.json", {cache: "no-store"})
      .then(response => response.ok ? response.json() : null)
      .catch(() => null);
    Promise.all([requiredQueue, optionalConfirmedQueue]).then(([processQueue, confirmedQueue]) => {
      state.processEntries = processQueue.entries || [];
      state.confirmedEntries = confirmedQueue?.entries || [];
      if (!state.processEntries.length) throw new Error("没有可看的动作候选");
      const toggle = byId("confirmed-toggle");
      toggle.disabled = !state.confirmedEntries.length;
      toggle.textContent = `已确认的（${state.confirmedEntries.length}）`;
      toggle.title = state.confirmedEntries.length
        ? "查看正式角色动作库；不会改变制作过程候选"
        : "当前 run 尚未生成正式角色动作索引";
      renderConfirmedNavigation();
      return render();
    }).catch(error => { byId("counter").textContent = error.message; });
  </script>
</body>
</html>
