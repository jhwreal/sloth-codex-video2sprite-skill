<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>动作资产工作台</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.45 system-ui, sans-serif; background: #090d16; color: #edf2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 58px; padding: 8px 14px; border-bottom: 1px solid #28334b; background: #101728; }
    .header-actions, .mode-tabs { display: flex; gap: 7px; align-items: center; }
    button, select { font: inherit; }
    header button, header select { border: 1px solid #3a4967; border-radius: 7px; padding: 7px 10px; color: #edf2ff; background: #202c44; }
    header button { cursor: pointer; }
    header button:disabled { opacity: .4; cursor: default; }
    header button.active { border-color: #d7a947; color: #fff4ce; background: #5a421c; }
    #game-select[hidden] { display: none; }
    .heading { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #counter { padding: 6px 10px; border: 1px solid #6382b4; border-radius: 7px; color: #f5f8ff; background: #23314c; text-align: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #title { min-width: 0; overflow: hidden; color: #edf2ff; font-size: 16px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 34vw); min-height: calc(100vh - 58px); }
    main.library-mode { grid-template-columns: 270px minmax(0, 1fr) minmax(330px, 34vw); }
    #action-navigation { position: sticky; top: 58px; height: calc(100vh - 58px); padding: 12px 10px 22px; border-right: 1px solid #28334b; background: #0d1422; overflow: auto; }
    #action-navigation[hidden] { display: none; }
    .action-group { margin: 10px 8px 7px; color: #8796b1; font-size: 11px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .action-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; width: 100%; margin: 0 0 6px; padding: 9px 10px; border: 1px solid #27344d; border-radius: 8px; color: #dce6fb; text-align: left; background: #151f32; cursor: pointer; }
    .action-link:hover { border-color: #61789f; background: #1b2941; }
    .action-link.selected { border-color: #8ab4ff; box-shadow: 0 0 0 1px #8ab4ff inset; background: #223451; }
    .action-name { min-width: 0; overflow: hidden; font-weight: 780; text-overflow: ellipsis; white-space: nowrap; }
    .action-id { grid-column: 1 / -1; min-width: 0; overflow: hidden; color: #8695af; font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .action-state { align-self: start; padding: 2px 6px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .state-explicit_user_confirmation { color: #baf4cf; background: #17442c; }
    .state-legacy_compatibility { color: #d5dded; background: #39445a; }
    .state-game_bound { color: #ffe6a6; background: #5b4318; }
    .state-process_approved { color: #baf4cf; background: #17442c; }
    .state-process_pending { color: #d5dded; background: #39445a; }
    .new-marker { color: #8ac6ff; }
    #frames { align-content: start; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 14px; overflow: auto; }
    .frame { margin: 0; min-width: 0; border: 1px solid #28334b; border-radius: 9px; overflow: hidden; background: #121a2b; cursor: pointer; }
    .frame:hover { border-color: #61789f; }
    .frame:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
    .frame.selected { border-color: #8ab4ff; box-shadow: 0 0 0 2px #8ab4ff inset; background: #1a2942; }
    .frame img, video, #selected-frame { display: block; width: 100%; object-fit: contain; image-rendering: pixelated; background-color: #172135; background-image: linear-gradient(45deg,#26344d 25%,transparent 25%),linear-gradient(-45deg,#26344d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#26344d 75%),linear-gradient(-45deg,transparent 75%,#26344d 75%); background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
    .frame img { aspect-ratio: 18 / 11; }
    figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; color: #aeb9cd; font-size: 12px; font-variant-numeric: tabular-nums; }
    aside { position: sticky; top: 58px; display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 58px); min-height: 0; padding: 16px; border-left: 1px solid #28334b; background: #101728; overflow: hidden; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 19px; overflow-wrap: anywhere; }
    h2 { font-size: 15px; }
    .viewer-panel { display: flex; flex-direction: column; min-height: 0; }
    .video-panel { flex: 0 1 47%; }
    .still-panel { flex: 1 1 53%; }
    .viewer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    #selected-label { color: #aeb9cd; font-size: 12px; font-variant-numeric: tabular-nums; }
    video { flex: 1; min-height: 0; border-radius: 10px; }
    #selected-frame { flex: 1; min-height: 0; border: 1px solid #28334b; border-radius: 10px; }
    #message { color: #ffd27b; }
    #action-meta { display: grid; gap: 5px; padding: 9px 11px; border: 1px solid #33415d; border-radius: 8px; color: #cbd6ea; background: #162034; font-size: 12px; }
    #action-meta[hidden] { display: none; }
    #action-status { justify-self: start; }
    #action-note { color: #9faeca; overflow-wrap: anywhere; }
    @media (max-width: 1050px) {
      header { grid-template-columns: auto minmax(0, 1fr); }
      .heading { grid-column: 1 / -1; }
    }
    @media (max-width: 820px) {
      header { grid-template-columns: 1fr; }
      .header-actions, .mode-tabs { flex-wrap: wrap; }
      .heading { grid-column: auto; }
      main, main.library-mode { grid-template-columns: 1fr; }
      #action-navigation { position: static; height: auto; max-height: 38vh; border-right: 0; border-bottom: 1px solid #28334b; }
      aside { position: static; height: auto; overflow: visible; border-left: 0; border-top: 1px solid #28334b; }
      #frames { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      video, #selected-frame { min-height: 42vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-actions">
      <button id="prev">← 上一个</button>
      <button id="next">下一个 →</button>
    </div>
    <div class="mode-tabs" role="tablist" aria-label="动作范围">
      <button id="mode-process" class="active" role="tab" aria-selected="true">工作中（0）</button>
      <button id="mode-character" role="tab" aria-selected="false" disabled>角色动作（0）</button>
      <button id="mode-game" role="tab" aria-selected="false" disabled>游戏动作（0）</button>
      <select id="game-select" aria-label="选择游戏" hidden></select>
    </div>
    <div class="heading">
      <span id="counter" aria-label="当前 Sprite 和总 Sprite 数">加载中…</span>
      <h1 id="title">动作资产工作台</h1>
    </div>
  </header>
  <main>
    <nav id="action-navigation" aria-label="动作名称列表" hidden></nav>
    <section id="frames" aria-label="全部关键帧"></section>
    <aside>
      <section id="action-meta" hidden aria-label="角色与游戏动作归属">
        <span id="action-status" class="action-state"></span>
        <span id="action-owner"></span>
        <span id="action-binding"></span>
        <span id="action-note"></span>
      </section>
      <section class="viewer-panel video-panel" aria-labelledby="video-heading">
        <div class="viewer-heading"><h2 id="video-heading">动作播放</h2><span id="timing"></span></div>
        <video id="preview" controls loop playsinline></video>
      </section>
      <section class="viewer-panel still-panel" aria-labelledby="still-heading">
        <div class="viewer-heading"><h2 id="still-heading">单帧查看</h2><span id="selected-label">请选择左侧帧</span></div>
        <img id="selected-frame" alt="当前选中的动作帧">
      </section>
      <div id="message" role="status"></div>
    </aside>
  </main>
  <script>
    const state = {
      mode: "process",
      processEntries: [],
      characterEntries: [],
      entryById: new Map(),
      games: [],
      selectedGameId: "",
      indices: {process: 0, character: 0},
      renderToken: 0,
      frames: [],
      selectedFrameIndex: -1,
      selectedFigure: null
    };
    const byId = id => document.getElementById(id);
    const safePath = value => value ? encodeURI(value) : "";
    const selectedGame = () => state.games.find(game => game.game_id === state.selectedGameId) || null;
    const gameEntries = () => (selectedGame()?.bound_action_ids || []).map(id => state.entryById.get(id)).filter(Boolean);
    const currentEntries = () => state.mode === "process" ? state.processEntries : state.mode === "character" ? state.characterEntries : gameEntries();
    const characterSpriteLabel = entry => {
      const index = state.characterEntries.findIndex(candidate => candidate.action_id === entry.action_id);
      return index >= 0 ? `Sprite ${String(index + 1).padStart(2, "0")}` : "Sprite ?";
    };
    const indexKey = () => state.mode === "game" ? `game:${state.selectedGameId}` : state.mode;
    const currentIndex = () => Number(state.indices[indexKey()] || 0);
    const setCurrentIndex = value => { state.indices[indexKey()] = value; };

    function setVideo(path) {
      const video = byId("preview");
      video.pause();
      video.removeAttribute("src");
      if (path) video.src = safePath(path);
      video.load();
    }

    function framePath(manifestPath, relative) {
      const slash = manifestPath.lastIndexOf("/");
      return `${slash >= 0 ? manifestPath.slice(0, slash + 1) : ""}${relative}`;
    }

    function selectFrame(frame, manifestPath, figure) {
      if (state.selectedFigure) {
        state.selectedFigure.classList.remove("selected");
        state.selectedFigure.setAttribute("aria-selected", "false");
      }
      state.selectedFigure = figure;
      state.selectedFrameIndex = Number(figure.dataset.framePosition);
      figure.classList.add("selected");
      figure.setAttribute("aria-selected", "true");
      const index = Number(frame.index) + 1;
      const time = Number(frame.source_time_seconds || 0);
      byId("selected-frame").src = safePath(framePath(manifestPath, frame.file));
      byId("selected-frame").alt = `第 ${index} 帧，${time.toFixed(3)} 秒`;
      byId("selected-label").textContent = `#${String(index).padStart(2, "0")} · ${time.toFixed(3)}s`;
    }

    function moveSelectedFrame(delta) {
      if (!state.frames.length) return;
      const nextIndex = Math.max(0, Math.min(state.frames.length - 1, state.selectedFrameIndex + delta));
      const next = state.frames[nextIndex];
      selectFrame(next.frame, next.manifestPath, next.figure);
      next.figure.focus({preventScroll: true});
      next.figure.scrollIntoView({block: "nearest", inline: "nearest"});
    }

    function renderFrames(manifest, manifestPath) {
      const container = byId("frames");
      container.replaceChildren();
      state.frames = [];
      state.selectedFrameIndex = -1;
      state.selectedFigure = null;
      for (const [position, frame] of (manifest.frames || []).entries()) {
        const figure = document.createElement("figure");
        figure.className = "frame";
        figure.dataset.framePosition = String(position);
        figure.tabIndex = 0;
        figure.setAttribute("role", "button");
        figure.setAttribute("aria-selected", "false");
        const image = document.createElement("img");
        image.loading = "lazy";
        image.alt = `第 ${Number(frame.index) + 1} 帧`;
        image.src = safePath(framePath(manifestPath, frame.file));
        const caption = document.createElement("figcaption");
        const number = document.createElement("span");
        number.textContent = `#${String(Number(frame.index) + 1).padStart(2, "0")}`;
        const time = document.createElement("span");
        time.textContent = `${Number(frame.source_time_seconds || 0).toFixed(3)}s`;
        caption.append(number, time);
        figure.append(image, caption);
        figure.onclick = () => selectFrame(frame, manifestPath, figure);
        figure.onkeydown = event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectFrame(frame, manifestPath, figure);
          }
        };
        container.appendChild(figure);
        state.frames.push({frame, manifestPath, figure});
        if (!state.selectedFigure) selectFrame(frame, manifestPath, figure);
      }
    }

    function renderNavigation() {
      const navigation = byId("action-navigation");
      const entries = currentEntries();
      navigation.replaceChildren();
      let previousGroup = "";
      let selectedButton = null;
      for (const [index, entry] of entries.entries()) {
        const group = state.mode === "process" ? "工作中 Sprite" : (entry.group || "其他");
        if (group !== previousGroup) {
          const heading = document.createElement("div");
          heading.className = "action-group";
          heading.textContent = group;
          navigation.appendChild(heading);
          previousGroup = group;
        }
        const button = document.createElement("button");
        button.className = "action-link";
        button.classList.toggle("selected", index === currentIndex());
        button.dataset.entryIndex = String(index);
        if (index === currentIndex()) {
          selectedButton = button;
          button.setAttribute("aria-current", "true");
        }
        button.type = "button";
        const name = document.createElement("span");
        name.className = "action-name";
        name.textContent = state.mode === "process"
          ? `Sprite ${String(index + 1).padStart(2, "0")}`
          : `${characterSpriteLabel(entry)} · ${entry.display_name || entry.action_id}`;
        if (state.mode !== "process" && entry.new_this_round) {
          const marker = document.createElement("span");
          marker.className = "new-marker";
          marker.textContent = " · 本轮";
          name.appendChild(marker);
        }
        const status = document.createElement("span");
        const processApproved = entry.approval?.decision === "approved";
        const statusKind = state.mode === "process"
          ? (processApproved ? "process_approved" : "process_pending")
          : state.mode === "game" ? "game_bound" : entry.admission_basis;
        status.className = `action-state state-${statusKind}`;
        status.textContent = state.mode === "process"
          ? (processApproved ? "已确认" : "待确认")
          : state.mode === "game" ? "游戏已用" : (entry.admission_label || "角色动作");
        const identifier = document.createElement("span");
        identifier.className = "action-id";
        identifier.textContent = entry.action_id;
        button.title = state.mode === "process"
          ? `${entry.action_id} · ${entry.candidate_id || ""}`
          : `${characterSpriteLabel(entry)} · ${entry.action_id}`;
        button.setAttribute("aria-label", state.mode === "process"
          ? `Sprite ${index + 1}，${entry.action_id}，${status.textContent}`
          : `${name.textContent}，${status.textContent}`);
        button.append(name, status, identifier);
        button.onclick = () => {
          setCurrentIndex(index);
          render().catch(error => { byId("message").textContent = error.message; });
        };
        navigation.appendChild(button);
      }
      selectedButton?.scrollIntoView({block: "nearest", inline: "nearest"});
    }

    function renderActionMeta(entry) {
      const panel = byId("action-meta");
      if (state.mode === "process") {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      const status = byId("action-status");
      const game = selectedGame();
      const statusKind = state.mode === "game" ? "game_bound" : entry.admission_basis;
      status.className = `action-state state-${statusKind}`;
      status.textContent = state.mode === "game" ? "当前游戏已绑定" : (entry.admission_label || "角色动作");
      byId("action-owner").textContent = "角色归属：爱丽丝 · 标准侧视 v5 · 持剑";
      byId("action-binding").textContent = state.mode === "game"
        ? `游戏使用：${game?.display_name || ""}`
        : (entry.used_by_game_names || []).length
          ? `已被游戏使用：${entry.used_by_game_names.join("、")}`
          : "已进角色动作库；尚未绑定到当前这些游戏";
      const source = entry.source_review_sprite ? `来源审核 Sprite ${entry.source_review_sprite}。` : "";
      byId("action-note").textContent = `${source}${entry.note || ""}`;
    }

    function renderModeControls() {
      for (const mode of ["process", "character", "game"]) {
        const button = byId(`mode-${mode}`);
        const active = state.mode === mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      }
      byId("mode-process").textContent = `工作中（${state.processEntries.length}）`;
      byId("mode-character").textContent = `角色动作（${state.characterEntries.length}）`;
      const game = selectedGame();
      byId("mode-game").textContent = game
        ? `游戏动作（${game.display_name} · ${game.bound_action_ids.length}）`
        : "游戏动作（0）";
      byId("game-select").hidden = state.mode !== "game";
      byId("action-navigation").hidden = false;
      document.querySelector("main").classList.add("library-mode");
    }

    async function render() {
      renderModeControls();
      const entries = currentEntries();
      const index = Math.max(0, Math.min(entries.length - 1, currentIndex()));
      setCurrentIndex(index);
      const entry = entries[index];
      if (!entry) {
        byId("counter").textContent = "当前范围没有动作";
        return;
      }
      const token = ++state.renderToken;
      const scope = state.mode === "process" ? "工作中" : state.mode === "character" ? "角色动作" : `${selectedGame()?.display_name || "游戏"}动作`;
      byId("counter").textContent = `${scope}：第 ${index + 1} 个 / 共 ${entries.length} 个`;
      const spriteName = state.mode === "process"
        ? `${entry.action_id} · ${entry.candidate_id}`
        : `${characterSpriteLabel(entry)} · ${entry.display_name || entry.action_id} · ${entry.action_id}`;
      byId("title").textContent = spriteName;
      byId("title").title = spriteName;
      setVideo(entry.paths?.preview);
      byId("prev").disabled = index === 0;
      byId("next").disabled = index === entries.length - 1;
      byId("message").textContent = "";
      byId("selected-frame").removeAttribute("src");
      byId("selected-label").textContent = "请选择左侧帧";
      byId("frames").replaceChildren();
      byId("timing").textContent = "";
      renderActionMeta(entry);
      renderNavigation();
      const manifestPath = entry.paths?.manifest;
      if (!manifestPath) {
        byId("message").textContent = "缺少帧清单，请重新处理这个候选。";
        return;
      }
      const manifest = await fetch(safePath(manifestPath), {cache: "no-store"}).then(response => {
        if (!response.ok) throw new Error(`帧清单加载失败：HTTP ${response.status}`);
        return response.json();
      });
      if (token !== state.renderToken) return;
      byId("timing").textContent = `${manifest.frame_count} 帧 · ${manifest.fps} fps · ${manifest.duration_seconds}s`;
      renderFrames(manifest, manifestPath);
    }

    function move(delta) {
      const entries = currentEntries();
      setCurrentIndex(Math.max(0, Math.min(entries.length - 1, currentIndex() + delta)));
      render().catch(error => { byId("message").textContent = error.message; });
    }

    function switchMode(mode) {
      if (mode !== "process" && !state.characterEntries.length) return;
      state.mode = mode;
      render().catch(error => { byId("message").textContent = error.message; });
    }

    byId("prev").onclick = () => move(-1);
    byId("next").onclick = () => move(1);
    byId("mode-process").onclick = () => switchMode("process");
    byId("mode-character").onclick = () => switchMode("character");
    byId("mode-game").onclick = () => switchMode("game");
    byId("game-select").onchange = event => {
      state.selectedGameId = event.target.value;
      render().catch(error => { byId("message").textContent = error.message; });
    };
    document.addEventListener("keydown", event => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const tag = event.target?.tagName?.toLowerCase();
      if (["input", "textarea", "select", "button", "video"].includes(tag)) return;
      event.preventDefault();
      moveSelectedFrame(event.key === "ArrowLeft" ? -1 : 1);
    });

    const requiredQueue = fetch("review-queue.json", {cache: "no-store"}).then(response => {
      if (!response.ok) throw new Error(`制作过程队列加载失败：HTTP ${response.status}`);
      return response.json();
    });
    const optionalCharacterQueue = fetch("character-action-queue.json", {cache: "no-store"})
      .then(response => response.ok ? response.json() : null)
      .catch(() => null);
    Promise.all([requiredQueue, optionalCharacterQueue]).then(([processQueue, characterQueue]) => {
      state.processEntries = processQueue.entries || [];
      state.characterEntries = characterQueue?.entries || [];
      state.entryById = new Map(state.characterEntries.map(entry => [entry.action_id, entry]));
      state.games = characterQueue?.games || [];
      state.selectedGameId = state.games.find(game => game.is_default)?.game_id || state.games[0]?.game_id || "";
      if (!state.processEntries.length) throw new Error("没有可看的动作候选");
      const select = byId("game-select");
      select.replaceChildren(...state.games.map(game => {
        const option = document.createElement("option");
        option.value = game.game_id;
        option.textContent = `${game.display_name}（${game.bound_action_ids.length}）`;
        option.selected = game.game_id === state.selectedGameId;
        return option;
      }));
      byId("mode-character").disabled = !state.characterEntries.length;
      byId("mode-game").disabled = !state.games.length;
      return render();
    }).catch(error => { byId("counter").textContent = error.message; });
  </script>
</body>
</html>
